name: Radar de concursos

on:
  schedule:
    # Horários em UTC → 07:17, 12:17 e 18:17 em Belém (UTC-3)
    - cron: "17 10,15,21 * * *"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

permissions:
  contents: write         # para salvar data/estado.json no repositório

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar radar
        run: python -m radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "radar-concursos[bot]"
          git config user.email "radar-concursos@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estado do radar"
            git push
          fi
